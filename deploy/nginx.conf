# Codexa Production Nginx Configuration
# Reverse Proxy for Django Backend & Gunicorn Socket

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=run_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_api:10m rate=60r/m;

upstream django_backend {
    server unix:/run/codexa/gunicorn.sock fail_timeout=0;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.knowledgestreamai.com;

    # ACME Challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.knowledgestreamai.com;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/api.knowledgestreamai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.knowledgestreamai.com/privkey.pem;

    # SSL Hardening (Mozilla Intermediate guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Payload buffer limits
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # Code execution endpoint
    location /api/run/ {
        # Per-student concurrency (max 1), replay detection, and global queue limits (max 2)
        # are enforced authoritatively by the Broker daemon. IP-based rate limiting is omitted
        # here to avoid throttling shared Vercel edge proxy egress IPs.

        # SECURITY: Strip any caller-forged X-Internal-Secret from untrusted public incoming requests
        # If incoming request is from Vercel Next.js edge with valid secret, pass through
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: Monotonically buffered stack (Broker: 14s, Gunicorn: 25s, Nginx: 30s)
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # General API endpoints
    location /api/ {
        limit_req zone=general_api burst=20 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 20s;
    }

    # Static files
    location /static/ {
        alias /var/www/codexa/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Health check
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
