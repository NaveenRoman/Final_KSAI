# Codexa Bootstrap HTTP-Only Nginx Configuration
# Active only until Certbot successfully provisions TLS certificates
# Serves ACME webroot challenge for Let's Encrypt validation

server {
    listen 80;
    listen [::]:80;
    server_name api.knowledgestreamai.com;

    # ACME Challenge root directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health check available during bootstrap
    location /healthz {
        access_log off;
        return 200 "bootstrap-ok\n";
    }

    # All other traffic returns 503 while TLS bootstrap is in progress
    location / {
        return 503 "TLS bootstrap in progress. Please retry in a few moments.\n";
    }
}
